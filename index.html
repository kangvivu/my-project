<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Deploy Test</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .card {
      width: min(90%, 600px);
      padding: 50px 35px;
      text-align: center;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.9;
    }

    .status {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #22c55e;
      font-weight: bold;
    }

    .time {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.75;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">🚀</div>

    <h1>Deploy thành công!</h1>

    <p>
      Nếu bạn đang nhìn thấy trang này thì file HTML
      đã được deploy lên GitHub thành công.
    </p>

    <div class="status">
      ● ONLINE
    </div>

    <div class="time" id="time"></div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();

      document.getElementById("time").textContent =
        "Thời gian hiện tại: " + now.toLocaleString("vi-VN");
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
